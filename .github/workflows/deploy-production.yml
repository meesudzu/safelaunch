name: deploy-production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to deploy (must be a green CI run)
        required: true
      ruleset:
        description: "Optional ruleset / prompt override (commit SHA prefix)"
        required: false
        default: ""
  release:
    types: [published]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: test (pre-deploy gate)
    # NOTE: ci.yml is now a reusable workflow (`on: workflow_call`) with no
    # declared inputs, so we can't pass `with: ref:` here. For `release: published`,
    # actions/checkout defaults to the released SHA; for `workflow_dispatch`, it
    # checks out the workflow's branch tip. If we later need to gate deploys on
    # an arbitrary ref, add `ref` to ci.yml's `workflow_call.inputs` and pipe it
    # into the checkout steps.
    uses: ./.github/workflows/ci.yml

  backup:
    name: D1 backup (export)
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.13.1
      - run: pnpm install --frozen-lockfile
      - name: Export D1 snapshot
        run: |
          mkdir -p artifacts/db-snapshot
          pnpm -C apps/workers exec wrangler d1 export DB --output=artifacts/db-snapshot/db.sql --env production
      - name: Upload D1 snapshot (redacted)
        uses: actions/upload-artifact@v4
        with:
          name: d1-snapshot-production
          path: artifacts/db-snapshot/db.sql
          retention-days: 90

  deploy:
    name: deploy to production
    needs: backup
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.smoke.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_COMMIT: ${{ github.event.inputs.ref || github.sha }}
      SAFELAUNCH_RULESET: ${{ github.event.inputs.ruleset || format('{0}', github.sha) }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.13.1
      - run: pnpm install --frozen-lockfile
      - name: Apply forward-only D1 migrations
        run: pnpm -C apps/workers exec wrangler d1 migrations apply DB --remote --env production
      - name: Deploy API Worker
        run: pnpm -C apps/workers exec wrangler deploy --env production
      - name: Deploy Web Worker (OpenNext)
        run: pnpm -C apps/web exec opennextjs-cloudflare build && pnpm -C apps/web exec opennextjs-cloudflare deploy --env production
      - name: Gradual traffic shift (10 / 50 / 100)
        run: |
          for share in 10 50 100; do
            echo "shifting ${share}% traffic to ${DEPLOY_COMMIT}"
            pnpm -C apps/workers exec wrangler versions deploy --percentage ${share} --comment "traffic-${share}%"
            sleep 60
          done
      - name: Smoke
        id: smoke
        run: node scripts/smoke.mjs --base-url "$PRODUCTION_URL"
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
      - name: Eval gate (release blocker)
        run: pnpm -C packages/ai test -- eval-runner
      - name: Latency probe
        run: node scripts/check-latency.mjs --base-url "$PRODUCTION_URL" --samples 50
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
      - name: Record deployment audit
        run: |
          cat <<EOF > artifacts/deployment.json
          {
            "commit": "${DEPLOY_COMMIT}",
            "ruleset": "${SAFELAUNCH_RULESET}",
            "model": "gpt-4o-mini",
            "corpus": "vn-mvp-v1",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - name: Upload deployment audit (redacted)
        uses: actions/upload-artifact@v4
        with:
          name: deployment-audit
          path: artifacts/deployment.json
          retention-days: 365
