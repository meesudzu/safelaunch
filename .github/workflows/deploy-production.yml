name: deploy-production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA to deploy (must be a green CI run)
        required: true
      ruleset:
        description: "Optional ruleset / prompt override (commit SHA prefix)"
        required: false
        default: ""
  release:
    types: [published]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: test (pre-deploy gate)
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.inputs.ref || github.sha }}

  backup:
    name: D1 backup (export)
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v5
        with:
          version: 10.13.1
      - run: pnpm install --frozen-lockfile
      - name: Export D1 snapshot
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/db-snapshot"
          pnpm -C apps/workers exec wrangler d1 export DB --remote --output="$GITHUB_WORKSPACE/artifacts/db-snapshot/db.sql"
      - name: Upload D1 snapshot (redacted)
        uses: actions/upload-artifact@v4
        with:
          name: d1-snapshot-production
          path: artifacts/db-snapshot/db.sql
          retention-days: 90

  deploy:
    name: deploy to production
    needs: backup
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.smoke.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_COMMIT: ${{ github.event.inputs.ref || github.sha }}
      SAFELAUNCH_RULESET: ${{ github.event.inputs.ruleset || format('{0}', github.sha) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v5
        with:
          version: 10.13.1
      - run: pnpm install --frozen-lockfile
      - name: Eval gate (release blocker)
        run: pnpm -C packages/ai test -- eval-runner
      - name: Apply forward-only D1 migrations
        run: pnpm -C apps/workers exec wrangler d1 migrations apply DB --remote
      - name: Deploy API Worker
        run: pnpm -C apps/workers exec wrangler deploy
      - name: Deploy Web Worker (OpenNext)
        run: pnpm -C apps/web exec opennextjs-cloudflare build && pnpm -C apps/web exec opennextjs-cloudflare deploy
      - name: Smoke
        id: smoke
        run: node scripts/smoke.mjs --base-url "$PRODUCTION_URL"
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
