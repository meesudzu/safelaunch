name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Allow this workflow to be consumed via `uses: ./.github/workflows/ci.yml`
  # from deploy-staging.yml / deploy-production.yml.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep report contents out of CI artifacts. The smoke + eval scripts already
  # use the redacted observability layer; we surface counts only.
  SAFELAUNCH_CI_REDACT: "1"

jobs:
  install:
    name: install (frozen lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.13.1
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

  format:
    name: format
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      - uses: pnpm/action-setup@v5
        with:
          version: 10.13.1
      - run: pnpm install --frozen-lockfile
      # apps/workers/tsconfig.json references ./worker-configuration.d.ts (a
      # wrangler-generated env/binding declaration file) in its `types` array.
      # Both ESLint (via projectService) and `tsc --noEmit` resolve that path
      # during format/lint/typecheck, so the file must exist before either
      # step runs. The build job also generates it as a side effect of
      # `wrangler deploy --dry-run`, but build runs *after* format/test —
      # too late for this job.
      - name: Generate Cloudflare Worker types
        run: pnpm --filter @safelaunch/workers exec wrangler types
      - name: Prettier check
        run: pnpm exec prettier --check "**/*.{ts,tsx,js,mjs,md,json,yml,yaml,css}"
      - name: ESLint
        run: pnpm -r --if-present lint
      - name: TypeScript
        run: pnpm -r --if-present typecheck

  test:
    name: test
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      - uses: pnpm/action-setup@v5
        with:
          version: 10.13.1
      - run: pnpm install --frozen-lockfile
      - name: Unit + integration tests
        run: pnpm -r --if-present test

  build:
    name: build
    needs: [format, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
      - uses: pnpm/action-setup@v5
        with:
          version: 10.13.1
      - run: pnpm install --frozen-lockfile
      - name: Web build (OpenNext + Cloudflare)
        env:
          NEXT_PUBLIC_API_ORIGIN: ${{ secrets.STAGING_API_ORIGIN }}
        run: pnpm -C apps/web build
      - name: Worker dry-run deploy
        run: pnpm --filter @safelaunch/workers build
      - name: Worker dry-run deploy (retention cron trigger)
        run: pnpm --filter @safelaunch/workers build && echo "dry-run-ok"

  secret-scan:
    name: secret scan
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Detect secrets
        run: |
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --no-banner --redact
          else
            echo "gitleaks not installed; skipping (install via package manager in your fork)"
          fi
